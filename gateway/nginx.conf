events {}

http {
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 80;
        limit_req zone=per_ip burst=10 nodelay;

        location = /login {
            proxy_pass http://user-service:8000;
        }


        location = /_verify {
            # only nginx can invoke this authentication subrequest with internal; the client cannot access it directly.
            internal;

            # this forwards the request to the auth service for verification.
            # and force the outgoing request to be GET, so that the auth service does not need to read the body.
            proxy_pass http://auth-service:8000/verify;
            proxy_method GET;

            # the auth service does not need the content
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # protect all other endpoints with auth_request
        # the syntax "location /" is the fallback of un-defined routers
        location / {
            # so the client can send whatever user-id, but it is untrusted
            # then nginx verifies JWT and replaces headers
            auth_request /_verify;

            # this line is kinda like: authenticated_user = auth_response.headers["X-User-ID"]
            auth_request_set $authenticated_user $upstream_http_x_user_id;
            # overwrite identity headers with the verified user id and secret, so that the backend service can trust them.
            proxy_set_header X-User-ID $authenticated_user;
            proxy_set_header X-Gateway-Secret "${GATEWAY_SECRET}";
            proxy_set_header Authorization "";

            # finally, forward the request to the backend service based on the path.
            # the path is defined below
            proxy_pass http://$backend;
        }
    }

    # Docker's embedded DNS resolves service names for variable proxy_pass.
    resolver 127.0.0.11 valid=10s;
    map $uri $backend {
        # this mean whatever orders/.... will be forwarded to order-service
        ~^/orders(?:/|$) order-service:8000;
        default user-service:8000;
    }
}
