name: int3105-security

services:
  user-service:
    build: ./user-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./user-service/app:/app/app

  order-service:
    build: ./order-service
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./order-service/app:/app/app

  auth-service:
    build: ./auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - ./auth-service/app:/app/app

  gateway:
    image: nginx:1.28-alpine
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^GATEWAY_SECRET$$
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      - user-service
      - order-service
      - auth-service

  minio:
    profiles: [storage]
    build: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
